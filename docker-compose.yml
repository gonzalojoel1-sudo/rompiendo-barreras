# Rompiendo Barreras - docker-compose.yml
# Uso:
#   1. Copia vps_backend/.env.example a vps_backend/.env y completa valores
#      (incluyendo TELEGRAM_BOT_TOKEN)
#   2. docker compose build
#   3. docker compose up -d
#   4. docker compose ps   (verificar estado "healthy" en ambos servicios)
#   5. curl http://localhost:8765/health
#   6. docker compose down   (detener; el volumen rb_vps_data persiste)
#
# Servicios:
#   - orca_backend: API FastAPI (puerto 8765)
#   - telegram_bot: bot que escucha notas de voz / texto de Marcos
#
services:
  orca_backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: rb_vps_backend:latest
    container_name: rb_vps_backend
    restart: unless-stopped
    ports:
      - "8765:8765"
    env_file:
      - ./vps_backend/.env
    environment:
      - SCRATCHPAD_PATH=/app/data/agent_scratchpad.json
      - APP_HOST=0.0.0.0
      - APP_PORT=8765
      - PYTHONPATH=/app
    volumes:
      - vps_data:/app/data
      - ./context_vault:/app/context_vault:ro
      - type: bind
        source: ./logs
        target: /app/logs
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request, json, sys; r = urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3); d = json.loads(r.read()); sys.exit(0 if d.get('status') == 'ok' else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =============================================================================
  # Bot de Telegram: escucha mensajes de Marcos (texto o nota de voz .ogg)
  # y dispara el orquestador en run_hybrid_squad.py --mode=ideate
  # =============================================================================
  telegram_bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: rb_vps_backend:latest           # Reusa la misma imagen
    container_name: rb_telegram_bot
    restart: unless-stopped
    depends_on:
      orca_backend:
        condition: service_healthy          # Espera al API sano antes de arrancar
    environment:
      # Variables que el bot necesita (caracter, no necesitan parse_dotenv)
      - PYTHONPATH=/app
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_ALLOWED_CHAT_IDS
      - TELEGRAM_LOG_LEVEL
      - MINIMAX_API_KEY
      - GOOGLE_APPLICATION_CREDENTIALS
      - GOOGLE_CLOUD_PROJECT
      - GOOGLE_CLOUD_REGION
      - NOTION_API_KEY
      - ORCA_API_KEY
    volumes:
      - type: bind
        source: ./logs
        target: /app/logs
      - type: bind
        source: ./vps_backend
        target: /app/vps_backend
      - type: bind
        source: ./config
        target: /app/config
      - type: bind
        source: ./scripts
        target: /app/scripts
      - type: bind
        source: ./manifests
        target: /app/manifests
      - type: bind
        source: ./context_vault
        target: /app/context_vault
      - type: bind
        source: ./secrets
        target: /app/secrets
      - type: volume
        source: vps_data
        target: /app/data
    command: ["python3", "/app/vps_backend/telegram_bot.py"]

volumes:
  vps_data:
    name: rb_vps_data
    driver: local

