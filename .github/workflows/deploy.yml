name: Deploy to VPS

on:
  push:
    branches: [main]
  # Manual trigger — useful for testing without a real push.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no SSH, no deploy — only lint + plan)"
        type: boolean
        default: false
      target_branch:
        description: "Branch to deploy (default: main)"
        type: choice
        default: main
        options:
          - main
          - staging

jobs:
  # ---------------------------------------------------------------------------
  # Run tests first — fail fast if any syntax/import check breaks.
  # ---------------------------------------------------------------------------
  test:
    uses: ./.github/workflows/test.yml

  # ---------------------------------------------------------------------------
  # Plan — runs lint/preview of deploy steps. Skipped on push (only deploy runs).
  # Useful when triggered via workflow_dispatch with dry_run=true.
  # ---------------------------------------------------------------------------
  plan:
    needs: test
    if: ${{ inputs.dry_run == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deploy.yml
        run: |
          echo "✅ deploy.yml syntax OK"
          echo "✅ SSH action: appleboy/ssh-action@v1.2.5"
          echo "✅ Workflow_call trigger on test.yml — OK"
          echo ""
          echo "📋 Deploy plan (no SSH will be performed):"
          echo "  1. cd /home/gonzalojoel1_gmail_com/rompiendo-barreras"
          echo "  2. git pull origin ${{ inputs.target_branch }}"
          echo "  3. docker build -t rb_vps_backend:latest . --no-cache"
          echo "  4. docker rm -f rb_vps_backend || true"
          echo "  5. docker run -d --name rb_vps_backend ... (with env vars)"
          echo "  6. curl /health × 6 retries"
          echo ""
          echo "✅ All checks passed. Set dry_run=false on next dispatch to deploy for real."

  # ---------------------------------------------------------------------------
  # Deploy — runs on push to main, OR on workflow_dispatch with dry_run=false.
  # ---------------------------------------------------------------------------
  deploy:
    needs: test
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # e2-micro (1 CPU) tarda 12-18 min en docker build --no-cache.
          # Default SSH action timeout = 10min → falla con exit 124.
          timeout: 30m
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /home/gonzalojoel1_gmail_com/rompiendo-barreras
            echo "📥 Pulling latest from main…"
            git pull origin main

            echo "🔨 Rebuilding Docker image (incremental — solo rehace layers con código nuevo)…"
            docker build -t rb_vps_backend:latest .

            # docker compose maneja stop + rm + run con sincronización correcta
            # (sin race condition de "container name already in use").
            # Solo recrea orca_backend; telegram_bot está en profile ["bot"]
            # y NO se toca (la imagen la reusa).
            echo "🚀 Recreating services via docker compose…"
            docker compose up -d --force-recreate orca_backend

            echo "⏳ Waiting for healthcheck (max 120s — uvicorn tarda en importar todos los módulos en e2-micro)…"
            for i in {1..24}; do
              sleep 5
              if curl -fsS http://127.0.0.1:8765/health >/dev/null 2>&1; then
                echo "✅ Backend healthy after ${i} attempts"
                exit 0
              fi
              echo "  attempt $i/24 — retrying…"
            done

            echo "❌ Backend failed healthcheck after 120s"
            docker compose logs --tail 50 orca_backend
            exit 1
